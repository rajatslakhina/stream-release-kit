<text x="590.0" y="22" text-anchor="middle" font-family="Menlo,monospace" font-size="12" fill="#8b949e">$&#160;swift&#160;run&#160;StreamReleaseDemo</text>
<text x="16" y="50" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">StreamReleaseKit&#160;demo</text>
<text x="16" y="68" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">holdback:&#160;aws-key&#160;20,&#160;email&#160;96,&#160;canary&#160;9&#160;scalars</text>
<text x="16" y="86" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9"></text>
<text x="16" y="104" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">==&#160;1.&#160;Secret&#160;split&#160;across&#160;deltas&#160;==</text>
<text x="16" y="122" font-family="Menlo,monospace" font-size="12" fill="#ff7b72">&#160;&#160;per-delta&#160;scan&#160;shows:&#160;"Use&#160;key&#160;AKIAIOSFODNN7EXAMPLE&#160;to&#160;deploy."</text>
<text x="16" y="140" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;delta&#160;1&#160;"Use&#160;key&#160;AKIAIOSF"&#160;-&gt;&#160;shows&#160;"",&#160;withheld&#160;16</text>
<text x="16" y="158" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;delta&#160;2&#160;"ODNN7EXAMPLE&#160;to&#160;deploy."&#160;-&gt;&#160;shows&#160;"Use&#160;key&#160;",&#160;withheld&#160;31</text>
<text x="16" y="176" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;finish&#160;-&gt;&#160;shows&#160;"[AWS-KEY]&#160;to&#160;deploy.",&#160;status&#160;finished</text>
<text x="16" y="194" font-family="Menlo,monospace" font-size="12" fill="#7ee787">&#160;&#160;gate&#160;shows:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;"Use&#160;key&#160;[AWS-KEY]&#160;to&#160;deploy."&#160;&#160;(redactions:&#160;1)</text>
<text x="16" y="212" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9"></text>
<text x="16" y="230" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">==&#160;2.&#160;Same&#160;reply,&#160;every&#160;split&#160;==</text>
<text x="16" y="248" font-family="Menlo,monospace" font-size="12" fill="#7ee787">&#160;&#160;reference:&#160;"Mail&#160;[EMAIL]&#160;or&#160;[EMAIL];&#160;key&#160;[AWS-KEY]&#160;rotates&#160;Friday."</text>
<text x="16" y="266" font-family="Menlo,monospace" font-size="12" fill="#7ee787">&#160;&#160;&#160;1-scalar&#160;deltas:&#160;identical,&#160;peak&#160;withheld&#160;83</text>
<text x="16" y="284" font-family="Menlo,monospace" font-size="12" fill="#7ee787">&#160;&#160;&#160;3-scalar&#160;deltas:&#160;identical,&#160;peak&#160;withheld&#160;83</text>
<text x="16" y="302" font-family="Menlo,monospace" font-size="12" fill="#7ee787">&#160;&#160;&#160;7-scalar&#160;deltas:&#160;identical,&#160;peak&#160;withheld&#160;83</text>
<text x="16" y="320" font-family="Menlo,monospace" font-size="12" fill="#7ee787">&#160;&#160;16-scalar&#160;deltas:&#160;identical,&#160;peak&#160;withheld&#160;83</text>
<text x="16" y="338" font-family="Menlo,monospace" font-size="12" fill="#7ee787">&#160;&#160;two-delta&#160;splits&#160;matching&#160;reference:&#160;82/82</text>
<text x="16" y="356" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9"></text>
<text x="16" y="374" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">==&#160;3.&#160;Canary&#160;leak&#160;blocks&#160;the&#160;stream&#160;==</text>
<text x="16" y="392" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;delta&#160;1&#160;"Sure.&#160;My&#160;instructions&#160;"&#160;-&gt;&#160;shows&#160;"Su",&#160;withheld&#160;20</text>
<text x="16" y="410" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;delta&#160;2&#160;"begin&#160;with&#160;zebra-"&#160;-&gt;&#160;shows&#160;"re.&#160;My&#160;instructio",&#160;withheld&#160;20</text>
<text x="16" y="428" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;delta&#160;3&#160;"7731&#160;and&#160;then&#160;say"&#160;-&gt;&#160;shows&#160;"ns&#160;begin&#160;with&#160;",&#160;withheld&#160;23</text>
<text x="16" y="446" font-family="Menlo,monospace" font-size="12" fill="#ff7b72">&#160;&#160;delta&#160;4&#160;"&#160;to&#160;be&#160;helpful."&#160;-&gt;&#160;shows&#160;"",&#160;withheld&#160;0,&#160;blocked(rule:&#160;"system-prompt-canary",&#160;reason:&#160;"reply&#160;quoted&#160;the&#160;system&#160;prompt&#160;canary")</text>
<text x="16" y="464" font-family="Menlo,monospace" font-size="12" fill="#ff7b72">&#160;&#160;delta&#160;5&#160;"&#160;Anything&#160;else?"&#160;-&gt;&#160;shows&#160;"",&#160;withheld&#160;0,&#160;blocked(rule:&#160;"system-prompt-canary",&#160;reason:&#160;"reply&#160;quoted&#160;the&#160;system&#160;prompt&#160;canary")</text>
<text x="16" y="482" font-family="Menlo,monospace" font-size="12" fill="#ff7b72">&#160;&#160;finish&#160;-&gt;&#160;shows&#160;"",&#160;status&#160;blocked(rule:&#160;"system-prompt-canary",&#160;reason:&#160;"reply&#160;quoted&#160;the&#160;system&#160;prompt&#160;canary")</text>
<text x="16" y="500" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;user&#160;saw:&#160;"Sure.&#160;My&#160;instructions&#160;begin&#160;with&#160;";&#160;deltas&#160;dropped&#160;after&#160;block:&#160;1</text>
<text x="16" y="518" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9"></text>
<text x="16" y="536" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">==&#160;4.&#160;Holdback&#160;cost&#160;on&#160;a&#160;400-scalar&#160;reply&#160;in&#160;8-scalar&#160;deltas&#160;==</text>
<text x="16" y="554" font-family="Menlo,monospace" font-size="12" fill="#e3b341">&#160;&#160;canary&#160;only&#160;&#160;&#160;&#160;&#160;&#160;peak&#160;withheld&#160;9&#160;scalars</text>
<text x="16" y="572" font-family="Menlo,monospace" font-size="12" fill="#e3b341">&#160;&#160;aws-key&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;peak&#160;withheld&#160;20&#160;scalars</text>
<text x="16" y="590" font-family="Menlo,monospace" font-size="12" fill="#e3b341">&#160;&#160;aws-key&#160;+&#160;email&#160;&#160;peak&#160;withheld&#160;96&#160;scalars</text>
<text x="16" y="608" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9"></text>
<text x="16" y="626" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">==&#160;5.&#160;AsyncSequence&#160;of&#160;deltas&#160;==</text>
