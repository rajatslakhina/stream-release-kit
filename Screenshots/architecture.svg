<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1000" height="520" rx="10" fill="#0d1117"/>
<text x="500" y="34" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">StreamReleaseKit&#160;&#8212;&#160;show&#160;a&#160;streamed&#160;reply&#160;only&#160;once&#160;no&#160;guard&#160;can&#160;change&#160;its&#160;mind</text>
<rect x="30" y="80" width="190" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="125.0" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">provider&#160;stream</text>
<text x="125.0" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">text&#160;deltas&#160;from&#160;an</text>
<text x="125.0" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">LLMSession&#160;/&#160;gateway</text>
<text x="125.0" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">(any&#160;AsyncSequence&lt;String&gt;)</text>
<rect x="300" y="60" width="380" height="250" rx="8" fill="#0f2a1a" stroke="#2ea043" stroke-width="1.5"/>
<text x="490.0" y="82" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">ReleaseGate&#160;(actor)</text>
<text x="490.0" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">raw:&#160;every&#160;scalar&#160;received,&#160;scanned&#160;as&#160;ONE&#160;text</text>
<text x="490.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">1.&#160;ingest(delta):&#160;target&#160;=&#160;received&#160;−&#160;holdback</text>
<text x="490.0" y="134" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">2.&#160;scan&#160;window&#160;[committed&#160;−&#160;context,&#160;end)</text>
<text x="490.0" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">3.&#160;resolve&#160;overlaps:&#160;earliest,&#160;longest,&#160;order</text>
<text x="490.0" y="166" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">4.&#160;a&#160;match&#160;straddling&#160;target&#160;pulls&#160;it&#160;back</text>
<text x="490.0" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">5.&#160;decided&#160;redact&#160;→&#160;replacement</text>
<text x="490.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">&#160;&#160;&#160;&#160;decided&#160;block&#160;→&#160;release&#160;prefix,&#160;stop</text>
<text x="490.0" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">6.&#160;finish():&#160;release&#160;the&#160;rest</text>
<text x="490.0" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">holdback&#160;=&#160;max(maxMatchLength&#160;−&#160;1&#160;+&#160;context)</text>
<text x="490.0" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">invariant:&#160;Σ&#160;releases&#160;==&#160;reference(whole&#160;text)</text>
<text x="490.0" y="262" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">for&#160;every&#160;way&#160;the&#160;stream&#160;was&#160;split</text>
<rect x="760" y="80" width="210" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="865.0" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">chat&#160;UI</text>
<text x="865.0" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">appends&#160;Release.text</text>
<text x="865.0" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">never&#160;shows&#160;text&#160;a</text>
<text x="865.0" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">guard&#160;could&#160;still&#160;flag</text>
<rect x="300" y="350" width="180" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="390.0" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">StreamScanner</text>
<text x="390.0" y="392" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">protocol,&#160;local&#160;by&#160;contract:</text>
<text x="390.0" y="408" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">maxMatchLength</text>
<text x="390.0" y="424" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">context</text>
<text x="390.0" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">matches(in:)</text>
<rect x="500" y="350" width="180" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="590.0" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">built-in&#160;scanners</text>
<text x="590.0" y="392" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">PatternScanner</text>
<text x="590.0" y="408" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">&#160;&#160;.awsAccessKeyID()</text>
<text x="590.0" y="424" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">&#160;&#160;.emailAddress()</text>
<text x="590.0" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">LiteralScanner</text>
<text x="590.0" y="456" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">&#160;&#160;(canary&#160;phrases)</text>
<rect x="760" y="250" width="210" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="865.0" y="272" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">Release&#160;/&#160;ReleaseStats</text>
<text x="865.0" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">text,&#160;findings,&#160;status</text>
<text x="865.0" y="308" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">streaming&#160;|&#160;finished&#160;|</text>
<text x="865.0" y="324" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">blocked(rule,&#160;reason)</text>
<text x="865.0" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9da7b3">peakWithheld&#160;=&#160;latency&#160;cost</text>
<rect x="30" y="250" width="190" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
